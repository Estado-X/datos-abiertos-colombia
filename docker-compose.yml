services:
  datos-abiertos-colombia:
    build:
      context: .
      dockerfile: Dockerfile
    image: datos-abiertos-colombia:latest
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    environment:
      - MCP_PORT=${MCP_PORT:-8000}
      - MCP_HOSTS_PERMITIDOS=${MCP_HOSTS_PERMITIDOS:-}
      - SOCRATA_APP_TOKEN=${SOCRATA_APP_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.getenv('MCP_PORT', '8000'); urllib.request.urlopen(f'http://localhost:{port}/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
