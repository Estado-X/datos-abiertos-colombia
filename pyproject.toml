[project]
name = "datos-abiertos-colombia"
dynamic = ["version"]
description = "Conector MCP para buscar y consultar los datos abiertos de Colombia (datos.gov.co). Adaptado de datagouv-mcp."
authors = [{ name = "Estado X" }, { name = "data.gouv.fr (proyecto original)", email = "opendatateam@data.gouv.fr" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mcp>=1.25.0,<2",
    "niquests>=3.19.1",
    "uvicorn>=0.30",
]

[project.scripts]
datos-abiertos-colombia = "datos_colombia.servidor:run"

[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datos_colombia*"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pruebas"]
python_files = ["test_*.py"]
markers = [
    "en_vivo: pruebas que consultan datos.gov.co en vivo (correr con -m en_vivo)",
]
addopts = "-m 'not en_vivo'"
