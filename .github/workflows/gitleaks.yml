# ─────────────────────────────────────────────────────────────
# Escaneo de secretos con gitleaks · Estado X · _seguridad/kit_repo · v1
# Adaptado para este repo: solo acepta acciones creadas por GitHub, así que
# en vez de gitleaks/gitleaks-action baja el programa gitleaks de su página
# oficial de versiones (versión fija) y comprueba su huella SHA-256 antes de
# usarlo. Por eso tampoco necesita el secreto GITLEAKS_LICENSE.
#
# Corre en GitHub con cada push y cada PR, también cuando subes por la web.
# Si encuentra una llave, el check sale en rojo y te llega el aviso de GitHub.
# Ojo: avisa DESPUÉS de que el commit entró; no lo impide. Si se dispara,
# la llave se da por filtrada: cámbiala primero, limpia después.
# ─────────────────────────────────────────────────────────────
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"   # lunes 4:00 a. m. Bogotá: repaso semanal de todo el historial

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (versión fija, con huella comprobada)
        env:
          VERSION: "8.30.1"
          # gitleaks_8.30.1_checksums.txt de la versión oficial, línea linux_x64 (verificada el 26/11/2026)
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Escanear todo el historial
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
